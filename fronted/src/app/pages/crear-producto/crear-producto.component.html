

<div class="container pt-5"> 
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">
                        Crear Producto
                    </h2>
                </div>
                <form [formGroup]="form"
                (ngSubmit)="crearProducto()"
                class="px-4">
                    <div class="mb-3 pro">
                        <label class="form-label ps-2">
                            Nombre del producto
                        </label>
                        <input type="text"
                            class="form-control"
                            formControlName="producto"
                            placeholder="Ingrese producto"
                        >
                        <small class="text-danger"
                            *ngIf="
                            form.get('producto')?.touched &&
                            form.get('producto')?.invalid
                            "
                        >
                            El nombre es requerido y debe tener minimo tres caracteres
                        </small>
                    </div>

                    <div class="mb-3 marca">
                        <label class="form-label ps-2">
                            Marca
                        </label>
                        <input type="text"
                            class="form-control"
                            formControlName="marca"
                            placeholder="Marca"
                        >
                        <small class="text-danger"
                            *ngIf="
                            form.get('marca')?.touched &&
                            form.get('marca')?.invalid
                            "
                        >
                            La marca es requerida y debe tener minimo un caracteres
                        </small>
                    </div>

                    <div class="mb-3 descripcion">
                        <label class="form-label ps-2">
                            Descripción
                        </label>
                        <textarea
                                rows="4"
                                class="form-control"
                                formControlName="descripcion">
                        </textarea>
                        <small class="text-danger"
                            *ngIf="
                            form.get('descripcion')?.touched &&
                            form.get('descripcion')?.invalid
                            "
                        >
                            La descripciónes requerida y debe tener minimo un caracteres
                        </small>
                    </div>


                    <div class="col-md-6 mb-3 categoria">

                                <label class="form-label">Categoría</label>

                                <select
                                    class="form-select"
                                    formControlName="categoria">

                                    <option value="">Seleccione...</option>
                                    <option value="Hombre">Hombre</option>
                                    <option value="Mujer">Mujer</option>
                                    <option value="Accesorio">Accesorio</option>

                                </select>

                            </div>

                    <div class="mb-3 precio">
                        <label class="form-label ps-2">
                            Precio
                        </label>
                        <input type="number"
                            class="form-control"
                            formControlName="precio"
                            placeholder="Precio"
                        >
                        <small class="text-danger"
                            *ngIf="
                            form.get('precio')?.touched &&
                            form.get('precio')?.invalid
                            "
                        >
                            El precio es requerido
                        </small>
                    </div>

                    <div class="mb-3 cantidad">
                        <label class="form-label ps-2">
                            Cantidad
                        </label>
                        <input type="number"
                            class="form-control"
                            formControlName="cantidad"
                            placeholder="Cantidad"
                        >
                        <small class="text-danger"
                            *ngIf="
                            form.get('cantidad')?.touched &&
                            form.get('cantidad')?.invalid
                            "
                        >
                            La cantidad minima es 1
                        </small>
                    </div>

                    <div class="mb-3 imagen">
                        <label class="form-label ps-2">
                            Imagen
                        </label>
                        <input  type="file"
                                    class="form-control"
                                    accept="image/*"
                                    (change)="seleccionarImagen($event)"
                        >
                    
                    </div>



                    <div class="d-flex justify-content-center">
                        <button class="btn btn-beige mb-2"
                        [disabled]="cargando">
                        {{  cargando  ? "Creando ...":"crear producto"}}

                        </button>
                    </div>
                    
                </form>
            </div>

        </div>
    </div>

</div>
