
<nav class="navbar navbar-expand-lg  navbar-light navegar">
        <div class="container">
            <a href="http://localhost:3000">
                <img
                    class="logo img-fluid d-block"
                    src="/Img/Logo.png"
                    alt="Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-search"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="#">Mujer</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Hombre</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Accesorios</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Promociones</a></li>
            </ul>
        </div>
    </nav>

<div class="container pt-5"> 
    <div class="row justify-content-center">
        <div class="col-med-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="text-center mb-4">
                        Inicio de sesión
                    </h2>
                </div>
                <div class="alert alert-danger" 
                    *ngIf="error">
                        {{error}}
                </div>
                <form [formGroup]="form"
                (ngSubmit)="iniciarsesion()"
                class="px-4">
                    <div class="mb-3">
                        <label class="form-label ps-2">
                            Email
                        </label>
                        <input type="email"
                            class="form-control"
                            formControlName="email"
                            placeholder="Email"
                        >
                        <small class="text-danger"
                            *ngIf="
                            form.get('email')?.touched &&
                            form.get('email')?.invalid
                            "
                        >
                            El email es invalido
                        </small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label ps-2">
                            Contraseña
                        </label>
                        <input type="password"
                            class="form-control"
                            formControlName="password"
                        >
                        <small class="text-danger"
                            *ngIf="
                            form.get('password')?.touched &&
                            form.get('password')?.invalid
                            "
                        >
                            El password debe tener minimo
                        </small>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button class="btn btn-beige mb-2"
                        [disabled]="cargando">
                        {{  cargando  ? "Iniciando sesión ...":"Iniciar sesión"}}

                        </button>

                    </div >
                    <div class="d-flex justify-content-center pt-2">
                       ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
                    </div>
                </form>
            </div>

        </div>
    </div>

</div>
