<!-- Hero -->
<section class="hero">
    <div class="container text-center">
        <h1 class="mb-3">Descubre la nueva colección</h1>
        <button class="btn btn-beige">Comprar</button>
    </div>

    <div class="container-fluid">
        <img
            class="logo img-fluid d-block mx-auto"
            src="/Img/Pareja fondo.png"
            alt="Pareja">
    </div>
</section>

<!-- Explora -->
<section class="Explora pb-2">
    <div class="container Moda text-center p-3">
        <h2>Explora la Moda</h2>
    </div>

    <div class="container cole d-flex gap-5 flex-md-row flex-column">
        <div class="container mujer ps-5">
            <p>Mujer</p>
            <button class="btn btn-beige">Ver colección</button>
        </div>

        <div class="container hombre pe-5">
            <p>Hombre</p>
            <button class="btn btn-beige">Ver colección</button>
        </div>
    </div>
</section>

<!-- Carrusel -->
<div class="carrusel container-fluid d-flex justify-content-center align-items-center p-3">

                <button
                class="botoncarrusel anterior"
                (click)="anterior()">
                &#10094;
            </button>

            <img
                class="img-fluid imagen-carrusel"
                [src]="imagenes[indice]"
                alt="Imagen">

            <button
                class="botoncarrusel siguiente "
                (click)="siguiente()">
                &#10095;
            </button>

</div>

<!-- Todos -->
<section class="Todos">
    <div>
        <h2>Moda y Estilo para Todos</h2>
    </div>

    <div class="Dise">
        <p>Diseño para hombres y mujeres</p>

        <button class="btn btn-beige text-center ms-4">
            Comprar Ahora
        </button>
    </div>
</section>
